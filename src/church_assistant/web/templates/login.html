<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — Church Meeting Assistant</title>

    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/app.css">

    <style>
        :root { color-scheme: light; }
        .login-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .login-card { width: 100%; max-width: 24rem; }
        .login-brand { text-align: center; margin-bottom: 1.5rem; }
        .login-brand h1 { margin-bottom: .25rem; font-size: 1.5rem; }
        .login-brand p { margin: 0; color: var(--pico-muted-color); font-size: .875rem; }
    </style>
</head>
<body>

<div class="login-shell">
    <article class="login-card">

        <div class="login-brand">
            <h1>📖 Church Meeting Assistant</h1>
            <p>Архів протоколів пасторської ради</p>
        </div>

        {% if error %}
        <p role="alert" style="color: var(--pico-del-color);">⚠️ {{ error }}</p>
        {% endif %}

        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next }}">

            <label for="username">
                Логін
                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ username }}"
                    autocomplete="username"
                    autocapitalize="none"
                    autofocus
                    required
                >
            </label>

            <label for="password">
                Пароль
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </label>

            <button type="submit">Увійти</button>
        </form>

    </article>
</div>

</body>
</html>

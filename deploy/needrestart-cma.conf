# Daily unattended upgrades must not restart the inference stack mid-job:
# an Ollama restart kills whatever chunk Gemma is on, and the worker units
# would drop a transcription hours in. Restart these by hand, between jobs.
$nrconf{override_rc}{qr(^ollama\.service$)} = 0;
$nrconf{override_rc}{qr(^cma-ingestion-worker\.service$)} = 0;
$nrconf{override_rc}{qr(^cma-query-worker\.service$)} = 0;
